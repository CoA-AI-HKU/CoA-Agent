# Example HTTP listener. Add the site's existing TLS certificate directives for
# production HTTPS. Only Nginx is browser-facing; the API binds to loopback.
#
# Everything under /api and /health is served by the single backend process
# (backend.main:app, port 8081) — including the reminder/auth/patient/
# emergency routes, which are mounted into that same app from
# src/reminders/app.py. There is no separate reminder service/port anymore.
server {
    listen 8080;
    server_name _;

    root /opt/coa/CoA-Agent/web;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location ~ ^/api/(chat|auth|reminders|patients|patient|emergency)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
