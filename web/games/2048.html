<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合併花園 2048</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17362c; background: radial-gradient(circle at top, #f8f4d9, #d8ede0 54%, #b9d9cc); }
    .game { width: min(100%, 520px); }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -.06em; line-height: .9; }
    .tagline { margin: 8px 0 0; color: #4c7160; font-size: .95rem; }
    .score-card { min-width: 104px; text-align: center; padding: 9px 14px; border-radius: 18px; color: #fffdf2; background: #2d6a54; box-shadow: 0 6px 0 #1f4b3c; }
    .score-card span { display: block; font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .78; }
    .score-card strong { font-size: 1.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 14px; }
    .goal { margin: 0; color: #315f4c; font-size: .9rem; }
    button { font: inherit; font-weight: 750; color: #fffdf2; background: #d66d45; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; box-shadow: 0 4px 0 #a84d31; }
    button:hover { background: #c85d38; } button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a84d31; }
    .board-wrap { position: relative; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; aspect-ratio: 1; border-radius: 24px; background: #397760; box-shadow: 0 10px 24px #1c4e3b44; touch-action: none; }
    .cell { display: grid; place-items: center; min-width: 0; border-radius: 16px; background: #27624e; color: #fffdf2; font-size: clamp(1.25rem, 8vw, 2.4rem); font-weight: 850; transition: background .16s, transform .16s; }
    .cell[data-value="0"] { color: transparent; background: #28604d; }.cell[data-value="1"] { background: #dbeaa8; color: #315a36; }.cell[data-value="2"] { background: #b8df94; color: #315a36; }.cell[data-value="3"] { background: #8acb83; }.cell[data-value="4"] { background: #61b786; }.cell[data-value="5"] { background: #42a487; }.cell[data-value="6"] { background: #368f8a; }.cell[data-value="7"] { background: #37778a; }.cell[data-value="8"] { background: #475f88; }.cell[data-value="9"] { background: #6b5689; }.cell[data-value="10"] { background: #a1567c; }.cell[data-value="11"] { background: #d26560; }.cell[data-value="12"] { background: #e68b49; }
    .cell.pop { transform: scale(1.08); }
    .message { position: absolute; inset: 10px; display: none; place-items: center; padding: 26px; text-align: center; border-radius: 16px; color: #fffdf2; background: #17362ce8; }.message.show { display: grid; }.message h2 { margin: 0 0 8px; font-size: 2rem; }.message p { margin: 0 0 18px; }
    .help { margin: 18px 0 0; text-align: center; color: #416c5a; line-height: 1.55; font-size: .92rem; }kbd { padding: 2px 5px; border-radius: 4px; color: #244938; background: #f7f4df; border: 1px solid #b8d0b5; font-family: inherit; }
    @media (max-width: 420px) { body { padding: 16px; }.board { gap: 7px; padding: 7px; border-radius: 18px; }.cell { border-radius: 12px; } }
  </style>
</head>
<body>
  <main class="game">
    <header><div><h1>合併花園</h1><p class="tagline">一個原創嘅 2048 數字合併遊戲。</p></div><div class="score-card"><span>分數</span><strong id="score">0</strong></div></header>
    <div class="toolbar"><p class="goal">將相同數字合併，合成 <strong>2048</strong>！</p><button id="new-game" type="button">重新開始</button></div>
    <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="合併花園遊戲棋盤"></div><div class="message" id="message" role="status"><div><h2 id="message-title"></h2><p id="message-text"></p><button id="play-again" type="button">再玩一次</button></div></div></div>
    <p class="help">用 <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> 方向鍵，或者喺螢幕掃動。每次移動，相同數字只會合併一次。</p>
  </main>
  <script>
    (() => {
      const size = 4, target = 11; let grid, score, finished, touchStart;
      const board = document.querySelector('#board'), scoreEl = document.querySelector('#score'), message = document.querySelector('#message'), title = document.querySelector('#message-title'), text = document.querySelector('#message-text');
      const cells = Array.from({ length: size * size }, () => { const el = document.createElement('div'); el.className = 'cell'; el.setAttribute('role', 'gridcell'); board.append(el); return el; });
      const emptyCells = () => grid.flatMap((row, r) => row.map((value, c) => value === 0 ? [r, c] : null).filter(Boolean));
      function plant() { const open = emptyCells(); if (!open.length) return; const [r, c] = open[Math.floor(Math.random() * open.length)]; grid[r][c] = Math.random() < .82 ? 1 : 2; }
      function draw(popped = []) { cells.forEach((cell, index) => { const r = Math.floor(index / size), c = index % size, level = grid[r][c], value = level ? 2 ** level : 0; cell.textContent = value || ''; cell.dataset.value = level; cell.setAttribute('aria-label', value ? `數字 ${value}` : '空格'); cell.classList.toggle('pop', popped.some(([pr, pc]) => pr === r && pc === c)); }); scoreEl.textContent = score; if (popped.length) setTimeout(() => cells.forEach(cell => cell.classList.remove('pop')), 170); }
      function linePositions(direction, fixed) { const out = []; for (let i = 0; i < size; i++) { const n = direction === 'left' || direction === 'up' ? i : size - 1 - i; out.push(direction === 'left' || direction === 'right' ? [fixed, n] : [n, fixed]); } return out; }
      function transformedLine(values) { const seeds = values.filter(Boolean), result = [], merges = []; for (let i = 0; i < seeds.length; i++) { if (seeds[i] === seeds[i + 1]) { result.push(seeds[i] + 1); merges.push(result.length - 1); i++; } else result.push(seeds[i]); } while (result.length < size) result.push(0); return { result, merges }; }
      function move(direction) { if (finished) return; let changed = false; const popped = []; for (let fixed = 0; fixed < size; fixed++) { const positions = linePositions(direction, fixed), oldValues = positions.map(([r, c]) => grid[r][c]), { result, merges } = transformedLine(oldValues); positions.forEach(([r, c], i) => { if (oldValues[i] !== result[i]) changed = true; grid[r][c] = result[i]; if (merges.includes(i)) { popped.push([r, c]); score += 2 ** result[i]; } }); } if (!changed) return; plant(); draw(popped); if (grid.flat().includes(target)) finish('開花成功！', '你合成咗 2048！'); else if (!emptyCells().length && !['left', 'right', 'up', 'down'].some(canMove)) finish('冇位喇', '準備好嘅時候，可以重新開始。'); }
      function canMove(direction) { for (let f = 0; f < size; f++) { const positions = linePositions(direction, f), original = positions.map(([r, c]) => grid[r][c]), { result } = transformedLine(original); if (original.some((value, i) => value !== result[i])) return true; } return false; }
      function finish(heading, detail) { finished = true; title.textContent = heading; text.textContent = detail; message.classList.add('show'); }
      function start() { grid = Array.from({ length: size }, () => Array(size).fill(0)); score = 0; finished = false; message.classList.remove('show'); plant(); plant(); draw(); }
      document.addEventListener('keydown', event => { const keys = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }; if (keys[event.key]) { event.preventDefault(); move(keys[event.key]); } });
      board.addEventListener('pointerdown', event => { touchStart = [event.clientX, event.clientY]; }); board.addEventListener('pointerup', event => { if (!touchStart) return; const dx = event.clientX - touchStart[0], dy = event.clientY - touchStart[1]; touchStart = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); });
      document.querySelector('#new-game').addEventListener('click', start); document.querySelector('#play-again').addEventListener('click', start); start();
    })();
  </script>
</body>
</html>
