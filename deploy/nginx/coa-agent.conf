# Example HTTP listener. Add the site's existing TLS certificate directives for
# production HTTPS. Only Nginx is browser-facing; the API binds to loopback.
#
# Reminders are chat-only (set by talking to the bot; see src/reminders/) —
# there is no reminder REST API or caregiver-dashboard login anymore, so
# nothing is proxied for /api/reminders, /api/patients, etc. Web account
# sign-in itself happens directly against Firebase from the browser (no
# proxying needed for that part) — /api/account/* below is only the
# backend's own contacts storage, which verifies the Firebase ID token
# the browser already obtained.
server {
    listen 80;
    listen [::]:80;
    server_name 104-131-176-48.sslip.io;

    root /opt/coa/CoA-Agent/web;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location = /api/chat {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/account/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/me(/|$) {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
