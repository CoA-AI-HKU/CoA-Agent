<!doctype html>

    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; color:#203d36; font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif; background:radial-gradient(circle at top,#fff8d8,#e2f0df 56%,#bfddd2); }
    main { width:min(100%,620px); } header { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:22px; } h1 { margin:0; font-size:clamp(2.2rem,8vw,3.7rem); letter-spacing:-.06em; } .subtitle { margin:7px 0 0; color:#537467; font-size:1rem; }

    .choices { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }.choice,.next { min-height:68px; border:0; border-radius:15px; cursor:pointer; font:inherit; font-size:clamp(1.35rem,5vw,1.8rem); font-weight:800; color:#244c3e; background:#e5f1db; box-shadow:0 4px 0 #bad0b3; }.choice:hover:not(:disabled){background:#cfe7bf}.choice:focus-visible,.next:focus-visible{outline:4px solid #e37b52;outline-offset:3px}.choice:disabled{cursor:default}.choice.correct{color:#fffdf6;background:#3e9c70;box-shadow:0 4px 0 #287653}.choice.wrong{color:#fffdf6;background:#d86b55;box-shadow:0 4px 0 #a94a3d}

    @media (max-width:420px){body{padding:16px}.card{border-radius:20px;padding:22px 16px}.idiom{gap:7px}.character{border-radius:12px}.choices{gap:9px}.choice{min-height:60px}}

      const levelSize = 10, scoreEl = document.querySelector('#score'), idiomEl = document.querySelector('#idiom'), choicesEl = document.querySelector('#choices'), feedbackEl = document.querySelector('#feedback'), nextEl = document.querySelector('#next'), progressEl = document.querySelector('#progress'), gameArea = document.querySelector('#game-area'), summaryEl = document.querySelector('#summary'), summaryTitle = document.querySelector('#summary-title'), summaryText = document.querySelector('#summary-text');
      let score = 0, level = 1, questionIndex = 0, levelCorrect = 0, current, used = new Set(), questionPlan = [];
      function shuffled(items) { return [...items].sort(() => Math.random() - .5); }
      function updateProgress() { progressEl.textContent = `第 ${level} 關　｜　第 ${questionIndex + 1}／${levelSize} 題　｜　本關答啱 ${levelCorrect} 題　｜　題庫 ${idiomBank.length} 條`; }
      function makeLevel() { if (idiomBank.length - used.size < levelSize) used.clear(); const available = shuffled(idiomBank.filter(item => !used.has(item))).slice(0, levelSize); available.forEach(item => used.add(item)); questionPlan = available.map(idiom => ({ idiom, blank: Math.floor(Math.random() * 4) })); questionIndex = 0; levelCorrect = 0; gameArea.hidden = false; summaryEl.hidden = true; renderQuestion(); }
      function renderQuestion() { const plan = questionPlan[questionIndex], characters = Array.from(plan.idiom), answer = characters[plan.blank], distractors = shuffled([...new Set(idiomBank.join(''))].filter(char => char !== answer)).slice(0, 3); current = { ...plan, answer }; idiomEl.replaceChildren(...characters.map((char, index) => { const cell = document.createElement('div'); cell.className = `character${index === plan.blank ? ' blank' : ''}`; cell.textContent = index === plan.blank ? '？' : char; return cell; })); choicesEl.replaceChildren(...shuffled([answer, ...distractors]).map(char => { const button = document.createElement('button'); button.type = 'button'; button.className = 'choice'; button.textContent = char; button.setAttribute('aria-label', `選擇「${char}」`); button.addEventListener('click', () => choose(char, button)); return button; })); feedbackEl.textContent = ''; nextEl.hidden = true; updateProgress(); }

      function finishLevel() { gameArea.hidden = true; summaryEl.hidden = false; summaryTitle.textContent = `第 ${level} 關完成！`; summaryText.textContent = `今關答啱 ${levelCorrect}／${levelSize} 題。想再練習，可以再玩本關。`; progressEl.textContent = `已完成第 ${level} 關　｜　題庫 ${idiomBank.length} 條成語`; document.querySelector('#replay').focus(); }
      nextEl.addEventListener('click', () => { questionIndex++; if (questionIndex === levelSize) finishLevel(); else renderQuestion(); });
      document.querySelector('#replay').addEventListener('click', () => { questionIndex = 0; levelCorrect = 0; gameArea.hidden = false; summaryEl.hidden = true; renderQuestion(); });
      document.querySelector('#new-level').addEventListener('click', () => { level++; makeLevel(); }); makeLevel();
    })();
